<div class="container-fluid page-container">
  <div class="main-card">
    <!-- HEADER -->
    <div class="page-header">
      <div class="page-title">
        <mat-icon>history</mat-icon>
        <span>Reopen Summary Report</span>

        <button type="button" class="collapse-btn" (click)="togglePanel()" [attr.aria-expanded]="isPanelVisible" title="Toggle Search Panel">
          @if (isPanelVisible) {
            <i class="fa-solid fa-angle-up"></i>
          } @else {
            <i class="fa-solid fa-angle-down"></i>
          }
        </button>
      </div>
    </div>

    <mat-divider></mat-divider>

    <!-- SEARCH PANEL -->
    <div class="search-panel" *ngIf="isPanelVisible">
      <div class="row g-3 align-items-end">
        <!-- USER NAME -->
        <div class="col-12 col-md-6 col-xl-3">
          <label class="field-label">User Name</label>

          <div class="client-dropdown-container">
            <input
              type="text"
              class="form-control client-search-input"
              placeholder="Search User..."
              [(ngModel)]="userSearchText"
              name="userSearch"
              (input)="filterUsers()"
              (focus)="showUserDropdown = true"
            />

            <button *ngIf="userSearchText" type="button" class="clear-search-btn" (click)="clearUserSearch()" title="Clear search">×</button>

            <div class="client-dropdown-list" *ngIf="showUserDropdown && userSearchText.trim().length >= 3">
              <div class="client-dropdown-item" *ngFor="let user of filteredUsers" (click)="selectUser(user)">
                {{ user.firstName }}
              </div>

              <div class="client-dropdown-item no-client-found" *ngIf="filteredUsers.length === 0">No User Found</div>
            </div>
          </div>
        </div>

        <!-- DEPARTMENT -->
        <div class="col-12 col-md-6 col-xl-3">
          <label class="field-label">Department</label>

          <div class="department-dropdown">
            <button type="button" class="department-select" (click)="showDepartmentDropdown = !showDepartmentDropdown" [attr.aria-expanded]="showDepartmentDropdown">
              <span>
                {{ selectedDepartmentIds.length === 0 ? '-- Select Department --' : selectedDepartmentIds.length + ' Department(s) Selected' }}
              </span>

              <mat-icon>
                {{ showDepartmentDropdown ? 'keyboard_arrow_up' : 'keyboard_arrow_down' }}
              </mat-icon>
            </button>

            <div class="department-options" *ngIf="showDepartmentDropdown">
              <label class="department-option" *ngFor="let department of departments">
                <input type="checkbox" [checked]="selectedDepartmentIds.includes(+department.departmentId)" (change)="onDepartmentChange(+department.departmentId, $any($event.target).checked)" />

                <span>{{ department.name }}</span>
              </label>

              <div class="no-departments" *ngIf="!departments || departments.length === 0">No departments available.</div>

              <button type="button" class="clear-departments" *ngIf="selectedDepartmentIds.length > 0" (click)="clearDepartments()">Clear departments</button>
            </div>
          </div>
        </div>

        <!-- FROM DATE -->
        <div class="col-12 col-md-6 col-xl-3">
          <label class="field-label">From Date</label>

          <div class="date-filter-input">
            <input type="text" class="form-control date-input" [matDatepicker]="fromPicker" [(ngModel)]="fromDate" [max]="toDate" placeholder="DD-MM-YYYY" readonly (click)="fromPicker.open()" />

            <button type="button" class="search-button" (click)="fromPicker.open()" title="Select date">
              <mat-icon>calendar_today</mat-icon>
            </button>

            <mat-datepicker #fromPicker></mat-datepicker>
          </div>
        </div>

        <!-- TO DATE -->
        <div class="col-12 col-md-6 col-xl-3">
          <label class="field-label">To Date</label>

          <div class="date-filter-input">
            <input type="text" class="form-control date-input" [matDatepicker]="toPicker" [(ngModel)]="toDate" [min]="fromDate" placeholder="DD-MM-YYYY" readonly (click)="toPicker.open()" />

            <button type="button" class="search-button" (click)="toPicker.open()" title="Select date">
              <mat-icon>calendar_today</mat-icon>
            </button>

            <mat-datepicker #toPicker></mat-datepicker>
          </div>
        </div>
      </div>

      <!-- ACTION BUTTONS -->
      <div class="row mt-3">
        <div class="col-12">
          <div class="filter-action">
            <button type="button" class="go-button" (click)="onSearch()">
              <mat-icon>search</mat-icon>
              Go
            </button>

            <button type="button" class="btn-clear" (click)="clearFilters()">Clear</button>

            @if (exportExcel === 'Y') {
              <button type="button" class="btn-export-excel" (click)="exportToExcel()">
                Export to Excel
                <i class="fas fa-file-excel" aria-hidden="true"></i>
              </button>
            }
          </div>
        </div>
      </div>
    </div>

    <mat-divider></mat-divider>

    <!-- TABLE SECTION -->
    <div class="table-section">
      <!-- TOP PAGINATION -->
      <div class="table-toolbar">
        <div class="record-summary">
          {{ recordSummary }}
        </div>

        <div class="pagination">
          <button type="button" class="pagination-btn" (click)="goToFirstPage()" [disabled]="currentPage === 1">« First</button>

          <button type="button" class="pagination-btn" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">‹ Prev</button>

          <button type="button" class="pagination-btn" *ngFor="let p of pages()" (click)="goToPage(p)" [class.active-pagination]="p === currentPage">
            {{ p }}
          </button>

          <button type="button" class="pagination-btn" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Next ›</button>

          <button type="button" class="pagination-btn" (click)="goToLastPage()" [disabled]="currentPage === totalPages">Last »</button>
        </div>
      </div>

      <!-- TABLE -->
      <div class="scroll-area" style="--table-min-width: 900px">
        <div class="top-scroll" #topScroll (scroll)="tableWrapper.scrollLeft = topScroll.scrollLeft">
          <div class="top-scroll-inner"></div>
        </div>

        <div class="table-wrapper table-scroll" #tableWrapper (scroll)="topScroll.scrollLeft = tableWrapper.scrollLeft">
          <table class="table access-table mb-0">
            <thead>
              <tr>
                <th>#</th>

                <th *ngFor="let col of columns; let i = index" [class.sticky-2]="i === 0" [class.sortable-column]="col.sortable" (click)="col.sortable && sortData(col.key)">
                  <div class="column-header">
                    <span>{{ col.label }}</span>

                    <span *ngIf="col.sortable" class="sort-icons">
                      <span [class.sort-active]="sortColumn === col.key && sortDirection === 'asc'"> ▲ </span>

                      <span [class.sort-active]="sortColumn === col.key && sortDirection === 'desc'"> ▼ </span>
                    </span>
                  </div>
                </th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let r of rows; let i = index">
                <td class="serial-cell">
                  {{ (currentPage - 1) * recordsPerPage + i + 1 }}
                </td>

                <td class="text-left">
                  {{ r.username }}
                </td>

                <td class="text-left">
                  {{ r.taskCount }}
                </td>
              </tr>

              <!-- NO DATA -->
              <tr *ngIf="!rows || rows.length === 0">
                <td colspan="3" class="no-records">
                  <mat-icon>info_outline</mat-icon>
                  <span>No records found</span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- BOTTOM PAGINATION -->
        <div class="table-toolbar bottom-toolbar">
          <div class="record-summary">
            {{ recordSummary }}
          </div>

          <div class="pagination">
            <button type="button" class="pagination-btn" (click)="goToFirstPage()" [disabled]="currentPage === 1">« First</button>

            <button type="button" class="pagination-btn" (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 1">‹ Prev</button>

            <button type="button" class="pagination-btn" *ngFor="let p of pages()" (click)="goToPage(p)" [class.active-pagination]="p === currentPage">
              {{ p }}
            </button>

            <button type="button" class="pagination-btn" (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages">Next ›</button>

            <button type="button" class="pagination-btn" (click)="goToLastPage()" [disabled]="currentPage === totalPages">Last »</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
