<div class="sidebar">

  <!-- ================= BRAND ================= -->

  <div class="sidebar-brand">

    <div class="brand-logo">
      <mat-icon>domain</mat-icon>
    </div>

    <div class="brand-info">
      <strong>
        Society 123
      </strong>

      <span>
        Business Portal
      </span>
    </div>

  </div>


  <!-- ================= MENU ================= -->

  <nav class="sidebar-menu">

    <button
      type="button"
      class="menu-item"
      *ngFor="let item of menuItems"
      [class.active]="isMenuActive(item)"
      (click)="selectMenu(item)"
      [title]="item.label"
    >

      <mat-icon>
        {{ item.icon }}
      </mat-icon>

      <span>
        {{ item.label }}
      </span>

    </button>

  </nav>


  <!-- ================= USER ================= -->

  <div class="sidebar-user">

    <div class="user-avatar">
      {{ userInitials }}
    </div>

    <div class="user-info">

      <strong>
        {{ username }}
      </strong>

      <span>
        Manager
      </span>

    </div>

    <button
      type="button"
      class="more-button"
      title="More"
    >

      <mat-icon>
        more_vert
      </mat-icon>

    </button>

  </div>

</div>
