<div class="sidebar">
  <!-- =====================================================
       BRAND
  ====================================================== -->

  <div class="sidebar-brand">
    <div class="brand-logo">
      <mat-icon> domain </mat-icon>
    </div>

    <div class="brand-info">
      <strong> Society 123 </strong>

      <span> Business Portal </span>
    </div>
  </div>

  <!-- =====================================================
       MENU
  ====================================================== -->



<nav class="sidebar-menu">
  <ng-container *ngFor="let item of menuItems">

    <!-- Parent Menu -->
    <ng-container *ngIf="item.children?.length; else normalMenu">

      <button
        type="button"
        class="menu-item"
        [class.active]="isParentActive(item)"
        [class.expanded]="item.expanded"
        (click)="selectMenu(item)">

        <mat-icon>{{ item.icon }}</mat-icon>

        <span>{{ item.label }}</span>

        <mat-icon class="submenu-arrow">
          {{ item.expanded
            ? 'keyboard_arrow_up'
            : 'keyboard_arrow_down' }}
        </mat-icon>

      </button>

      <!-- Submenu -->
      <div class="submenu" *ngIf="item.expanded">

        <button
          type="button"
          class="menu-item submenu-item"
          *ngFor="let child of item.children"
          [class.active]="activeMenu === child.label"
          (click)="selectMenu(child)">

          <mat-icon>{{ child.icon }}</mat-icon>

          <span>{{ child.label }}</span>

        </button>

      </div>
    </ng-container>

    <!-- Normal Menu -->
    <ng-template #normalMenu>
      <button
        type="button"
        class="menu-item"
        [class.active]="activeMenu === item.label"
        (click)="selectMenu(item)">

        <mat-icon>{{ item.icon }}</mat-icon>

        <span>{{ item.label }}</span>

      </button>
    </ng-template>

  </ng-container>
</nav>



  <!-- =====================================================
       USER
  ====================================================== -->

  <div class="sidebar-user">
    <div class="user-avatar">
      {{ getInitials(username) }}
    </div>

    <div class="user-info">
      <small>
        {{ getShortName(username) }}
      </small>
    </div>

    <button type="button" class="more-button" [matMenuTriggerFor]="userMenu" (click)="$event.stopPropagation()">
      <mat-icon> more_vert </mat-icon>
    </button>
  </div>
</div>
