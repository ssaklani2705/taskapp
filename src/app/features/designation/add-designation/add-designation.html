<div class="user-page-wrapper container-fluid">
  <div class="user-portlet">

    <!-- ===== Header ===== -->
    <div class="user-portlet-title d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2">
      <div class="user-title d-flex align-items-center">
        <span class="user-page-title">
          {{ isEditMode ? 'Edit Designation Master' : 'Add Designation Master' }}
        </span>
      </div>

      <div class="user-actions">
        <button type="button" class="back-index-btn" (click)="backToIndexPage()">
          <mat-icon>arrow_back</mat-icon>
          Back to Index
        </button>
      </div>
    </div>

    <!-- ===== Body ===== -->
    <div class="user-portlet-body">
      <form #designationForm="ngForm" (ngSubmit)="onSubmit(designationForm)" novalidate>
        <div class="user-form-body">

          <div class="mandatory-message">
            Fields with <span class="required">*</span> mark are mandatory
          </div>

          <div class="row g-3 g-xl-4">

            <!-- Designation Name -->
            <div class="col-12 col-md-6 col-xl-4">
              <div class="user-form-group">
                <label class="user-label">Designation Name <span class="required">*</span></label>
                <input type="text" class="user-input" placeholder="Enter Designation Name"
                       [(ngModel)]="designation.name" name="name" required minlength="2" maxlength="50"
                       pattern="^[a-zA-Z0-9\s\.,;:=$\-_\+'&quot;/\\!@`#%&*()?]+$" #nameCtrl="ngModel"
                       (input)="designation.name = capitalizeFirstCharOnly(designation.name)">
                <div class="user-error" *ngIf="nameCtrl.invalid && nameCtrl.touched">
                  <span *ngIf="nameCtrl.errors?.['required']">Designation Name is required</span>
                  <span *ngIf="nameCtrl.errors?.['minlength']">Minimum 2 characters required</span>
                  <span *ngIf="nameCtrl.errors?.['pattern']">Invalid characters entered</span>
                </div>
              </div>
            </div>

            <!-- Sequence -->
            <div class="col-12 col-md-6 col-xl-4">
              <div class="user-form-group">
                <label class="user-label">Sequence <span class="required">*</span></label>
                <input type="text" class="user-input" placeholder="Enter Sequence"
                       [(ngModel)]="designation.sequence" name="sequence" required min="1" maxlength="6"
                       #sequenceCtrl="ngModel" (keypress)="allowOnlyNumbers($event)">
                <div class="user-error" *ngIf="sequenceCtrl.invalid && sequenceCtrl.touched">
                  <span *ngIf="sequenceCtrl.errors?.['required']">Sequence is required</span>
                  <span *ngIf="sequenceCtrl.errors?.['min']">Sequence must be greater than 0</span>
                  <span *ngIf="sequenceCtrl.errors?.['max']">Sequence is too large</span>
                </div>
              </div>
            </div>

            <!-- Status (edit mode only) -->
            <div class="col-12 col-md-6 col-xl-4" *ngIf="isEditMode">
              <div class="user-form-group">
                <label class="user-label">Status <span class="required">*</span></label>
                <select class="user-input user-select" [(ngModel)]="designation.status" name="status"
                        required #statusCtrl="ngModel">
                  <option [ngValue]="null">Select Status</option>
                  <option [ngValue]="1">Active</option>
                  <option [ngValue]="2">Inactive</option>
                </select>
                <div class="user-error" *ngIf="statusCtrl.invalid && statusCtrl.touched">
                  Status is required
                </div>
              </div>
            </div>

          </div>

          <!-- ===== Buttons ===== -->
          <div class="user-buttons">
            <button type="button" class="user-reset-btn" (click)="onReset()">Reset</button>
            <button type="submit" class="user-submit-btn">
              {{ isEditMode ? 'Update' : 'Submit' }}
            </button>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>
