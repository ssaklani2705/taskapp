<div class="user-page-wrapper">

  <div class="user-portlet">

    <!-- HEADER -->
    <div class="user-portlet-title">

      <div class="user-title">
        <span class="user-page-title">
          {{ isEditMode ? 'EDIT PLAN MASTER' : 'ADD PLAN MASTER' }}
        </span>
      </div>

      <div class="user-actions">
        <button type="button" class="back-index-btn" (click)="backToIndexPage()">
          Back to Index
        </button>
      </div>

    </div>

    <!-- BODY -->
    <div class="user-portlet-body">

      <form #planForm="ngForm" (ngSubmit)="onSubmit(planForm)" novalidate>

        <div class="user-form-body">

          <!-- Mandatory Message -->
          <div class="mandatory-message">
            Fields with
            <span class="required">*</span>
            mark are mandatory
          </div>


          <!-- NAME + RATE -->
          <div class="user-form-row">

            <!-- Plan Name -->
            <div class="user-form-col">

              <div class="user-form-group">

                <label class="user-label">
                  Plan Name
                  <span class="required">*</span>
                </label>

                <input type="text" class="user-input" placeholder="Enter Plan Name" [(ngModel)]="plan.name" name="name"
                  required minlength="2"    maxlength="50" #nameCtrl="ngModel">

                <div class="user-error" *ngIf="nameCtrl.invalid && nameCtrl.touched">

                  <span *ngIf="nameCtrl.errors?.['required']">
                    Plan Name is required
                  </span>

                  <span *ngIf="nameCtrl.errors?.['minlength']">
                    Minimum 2 characters required
                  </span>

                </div>

              </div>

            </div>


            <!-- Rate -->
            <div class="user-form-col">

              <div class="user-form-group">

                <label class="user-label">
                  Rate
                  <span class="required">*</span>
                </label>

                <input type="text" class="user-input" placeholder="Enter Plan Rate" [(ngModel)]="plan.rate"
                  name="rate" required min="0" #rateCtrl="ngModel"   (keypress)="allowOnlyNumbers($event)" maxlength="7">

                <div class="user-error" *ngIf="rateCtrl.invalid && rateCtrl.touched">

                  <span *ngIf="rateCtrl.errors?.['required']">
                    Rate is required
                  </span>

                  <span *ngIf="rateCtrl.errors?.['min']">
                    Rate cannot be negative
                  </span>

                </div>

              </div>

            </div>

          </div>


          <!-- DESCRIPTION -->
          <div class="user-form-row" style="margin-top: 20px;">

            <div class="user-form-col">

              <div class="user-form-group">

                <label class="user-label">
                  Description
                  <span class="required">*</span>
                </label>

                <textarea class="user-input user-textarea" placeholder="Enter Plan Description"
                  maxlength="250"
                  [(ngModel)]="plan.description" name="description" required rows="100" #descriptionCtrl="ngModel"
                  style="
    height: 100px !important;">
                </textarea>

                <div class="user-error" *ngIf="descriptionCtrl.invalid && descriptionCtrl.touched">

                  <span *ngIf="descriptionCtrl.errors?.['required']">
                    Description is required
                  </span>

                  <span *ngIf="descriptionCtrl.errors?.['minlength']">
                    Minimum 5 characters required
                  </span>

                </div>

              </div>

            </div>

            <div class="user-form-col" *ngIf="isEditMode">

              <div class="user-form-group">

                <label class="user-label">
                  Status
                  <span class="required">*</span>
                </label>

                <select class="user-input user-select" [(ngModel)]="plan.status" name="status" required
                  #statusCtrl="ngModel">

                  <option [ngValue]="null">
                    Select Status
                  </option>

                  <option [ngValue]="1">
                    Active
                  </option>

                  <option [ngValue]="2">
                    Inactive
                  </option>

                </select>

                <div class="user-error" *ngIf="statusCtrl.invalid && statusCtrl.touched">

                  Status is required

                </div>

              </div>

            </div>

          </div>


          <!-- STATUS -->
          <div class="user-form-row">



          </div>


          <!-- BUTTONS -->
          <div class="user-buttons">

            <button type="button" class="user-reset-btn" (click)="onReset()">

              Reset

            </button>

            <button type="submit" class="user-submit-btn">

              {{ isEditMode ? 'Update' : 'Submit' }}

            </button>

          </div>

        </div>

      </form>

    </div>

  </div>

</div>
