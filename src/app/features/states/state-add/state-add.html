<div class="user-page-wrapper">

  <div class="user-portlet">

    <!-- HEADER -->
    <div class="user-portlet-title">

      <div class="user-title">
        <span class="user-page-title">
          {{ isEditMode ? 'EDIT STATE' : 'ADD STATE' }}
        </span>
      </div>

      <div class="user-actions">
        <button type="button" class="back-index-btn" (click)="backToIndexPage()">
          Back to Index
        </button>
      </div>

    </div>

    <!-- BODY -->
    <div class="user-portlet-body">

      <form #stateForm="ngForm" (ngSubmit)="onSubmit(stateForm)" novalidate>

        <div class="user-form-body">

          <!-- Mandatory Message -->

          <div class="mandatory-message">
            Fields with
            <span class="required">*</span>
            mark are mandatory
          </div>

          <!-- ROW -->

          <div class="user-form-row">

            <!-- Name -->

            <div class="user-form-col">

              <div class="user-form-group">

                <label class="user-label">
                  Name
                  <span class="required">*</span>
                </label>

                <input
                  type="text"
                  class="user-input"
                  placeholder="Enter State Name"
                  [(ngModel)]="state.name"
                  name="name"
                  required
                  #nameCtrl="ngModel"
                  (input)="state.name = capitalizeFirstCharOnly(state.name)">

                <div class="user-error" *ngIf="nameCtrl.invalid && nameCtrl.touched">
                  <span *ngIf="nameCtrl.errors?.['required']">
                    State Name is required
                  </span>
                  <span *ngIf="nameCtrl.errors?.['minlength']">
                    Minimum 2 characters required
                  </span>
                </div>

              </div>

            </div>

            <!-- Code -->

            <div class="user-form-col">

              <div class="user-form-group">

                <label class="user-label">
                  Code
                  <span class="required">*</span>
                </label>

                <input
                  type="text"
                  class="user-input"
                  placeholder="Enter State Code"
                  [(ngModel)]="state.code"
                  name="code"
                  required
                  maxlength="2"
                  #codeCtrl="ngModel">

                <div class="user-error" *ngIf="codeCtrl.invalid && codeCtrl.touched">
                  <span *ngIf="codeCtrl.errors?.['required']">
                    State Code is required
                  </span>
                </div>

              </div>

            </div>

          </div>

          <!-- Status (edit mode only) -->

          <div class="user-form-row">
            <div class="user-form-col" *ngIf="isEditMode">

              <div class="user-form-group">

                <label class="user-label">
                  Status
                  <span class="required">*</span>
                </label>

                <select
                  class="user-input user-select"
                  [(ngModel)]="state.status"
                  name="status"
                  required
                  #statusCtrl="ngModel">

                  <option [ngValue]="null">Select Status</option>
                  <option [ngValue]="1">Active</option>
                  <option [ngValue]="2">Inactive</option>

                </select>

                <div class="user-error" *ngIf="statusCtrl.invalid && statusCtrl.touched">
                  Status is required
                </div>

              </div>

            </div>
          </div>

          <!-- BUTTONS -->

          <div class="user-buttons">

            <button type="button" class="user-reset-btn" (click)="onReset()">
              Reset
            </button>

            <button type="submit" class="user-submit-btn">
              {{ isEditMode ? 'Update' : 'Submit' }}
            </button>

          </div>

        </div>

      </form>

    </div>

  </div>

</div>
