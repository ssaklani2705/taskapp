<div class="user-page-wrapper container-fluid">
  <div class="user-portlet">

    <!-- ===== Header ===== -->
    <div class="user-portlet-title d-flex flex-column flex-sm-row align-items-sm-center justify-content-between gap-2">
      <div class="user-title d-flex align-items-center">
        <span class="user-page-title">
          {{ isEditMode ? 'Edit State Master' : 'Add State Master' }}
        </span>
      </div>

      <div class="user-actions">
        <button type="button" class="back-index-btn" (click)="backToIndexPage()">
          <mat-icon>arrow_back</mat-icon>
          Back to Index
        </button>
      </div>
    </div>

    <!-- ===== Body ===== -->
    <div class="user-portlet-body">
      <form #stateForm="ngForm" (ngSubmit)="onSubmit(stateForm)" novalidate>
        <div class="user-form-body">

          <div class="mandatory-message">
            Fields with <span class="required">*</span> mark are mandatory
          </div>

          <div class="row g-3 g-xl-4">

            <!-- Code -->
            <div class="col-12 col-md-6 col-xl-4">
              <div class="user-form-group">
                <label class="user-label">Code <span class="required">*</span></label>
                <input type="text" class="user-input" placeholder="Enter State Code"
                       [(ngModel)]="state.code" name="code" required maxlength="2" #codeCtrl="ngModel" />
                <div class="user-error" *ngIf="codeCtrl.invalid && codeCtrl.touched">
                  <span *ngIf="codeCtrl.errors?.['required']">State Code is required</span>
                </div>
              </div>
            </div>

            <!-- Name -->
            <div class="col-12 col-md-6 col-xl-4">
              <div class="user-form-group">
                <label class="user-label">Name <span class="required">*</span></label>
                <input type="text" class="user-input" placeholder="Enter State Name"
                       [(ngModel)]="state.name" name="name" required #nameCtrl="ngModel"
                       (input)="state.name = capitalizeFirstCharOnly(state.name)" />
                <div class="user-error" *ngIf="nameCtrl.invalid && nameCtrl.touched">
                  <span *ngIf="nameCtrl.errors?.['required']">State Name is required</span>
                  <span *ngIf="nameCtrl.errors?.['minlength']">Minimum 2 characters required</span>
                </div>
              </div>
            </div>

            <!-- Status (edit mode only) -->
            <div class="col-12 col-md-6 col-xl-4" *ngIf="isEditMode">
              <div class="user-form-group">
                <label class="user-label">Status <span class="required">*</span></label>
                <select class="user-input user-select" [(ngModel)]="state.status" name="status"
                        required #statusCtrl="ngModel">
                  <option [ngValue]="null">Select Status</option>
                  <option [ngValue]="1">Active</option>
                  <option [ngValue]="2">Inactive</option>
                </select>
                <div class="user-error" *ngIf="statusCtrl.invalid && statusCtrl.touched">
                  Status is required
                </div>
              </div>
            </div>

          </div>

          <!-- ===== Buttons ===== -->
          <div class="user-buttons">
            <button type="button" class="user-reset-btn" (click)="onReset()">Reset</button>
            <button type="submit" class="user-submit-btn">
              {{ isEditMode ? 'Update' : 'Submit' }}
            </button>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>
