
<div class="user-page-wrapper">
  <div class="user-portlet">

    <!-- HEADER -->
    <div class="user-portlet-title">
      <div class="user-title">
        <span class="user-page-title">
          {{ isEditMode ? 'Edit Service Master' : 'Add Service Master' }}
        </span>
      </div>

      <div class="user-actions">
        <button
          type="button"
          class="back-index-btn"
          (click)="backToIndexPage()">
          <mat-icon>arrow_back</mat-icon>
          Back to Index
        </button>
      </div>
    </div>

    <!-- BODY -->
    <div class="user-portlet-body">
      <form #serviceForm="ngForm"
            (ngSubmit)="onSubmit(serviceForm)"
            novalidate>

        <div class="user-form-body">

          <div class="mandatory-message">
            Fields with
            <span class="required">*</span>
            mark are mandatory
          </div>

          <!-- SERVICE NAME -->
          <div class="user-form-row">
            <div class="user-form-col">
              <div class="user-form-group">
                <label class="user-label">
                  Service Name
                  <span class="required">*</span>
                </label>

                <input
                  type="text"
                  class="user-input"
                  placeholder="Enter Service Name"
                  [(ngModel)]="service.name"
                  name="name"
                  required
                  minlength="2"
                  maxlength="100"
                  #nameCtrl="ngModel"
                />

                <div
                  class="user-error"
                  *ngIf="nameCtrl.invalid && nameCtrl.touched">

                  <span *ngIf="nameCtrl.errors?.['required']">
                    Service Name is required
                  </span>

                  <span *ngIf="nameCtrl.errors?.['minlength']">
                    Minimum 2 characters required
                  </span>

                </div>
              </div>
            </div>

            <!-- STATUS: EDIT MODE ONLY -->
            <div class="user-form-col" *ngIf="isEditMode">
              <div class="user-form-group">
                <label class="user-label">
                  Status
                  <span class="required">*</span>
                </label>

                <select
                  class="user-input user-select"
                  [(ngModel)]="service.status"
                  name="status"
                  required
                  #statusCtrl="ngModel">

                  <option [ngValue]="null">Select Status</option>
                  <option [ngValue]="1">Active</option>
                  <option [ngValue]="2">Inactive</option>

                </select>

                <div
                  class="user-error"
                  *ngIf="statusCtrl.invalid && statusCtrl.touched">
                  Status is required
                </div>
              </div>
            </div>
          </div>

          <!-- BUTTONS -->
          <div class="user-buttons">
            <button
              type="button"
              class="user-reset-btn"
              (click)="onReset()">
              Reset
            </button>

            <button type="submit" class="user-submit-btn">
              {{ isEditMode ? 'Update' : 'Submit' }}
            </button>
          </div>

        </div>
      </form>
    </div>
  </div>
</div>
