<div class="page-content-wrapper">
  <div class="page-content">
    <div class="row">
      <div class="col-md-12">
        <div class="portlet light portlet-fit portlet-form bordered">

          <!-- HEADER -->
          <div class="portlet-title">
            <div class="caption font-dark">
              <span class="caption-subject font-green sbold uppercase">
                {{ isEditMode ? "Edit" : "Add" }} Task Category
              </span>
            </div>

            <div class="actions">
              <label
                class="btn btn-transparent dark btn-outline btn-circle btn-sm active"
              >
                <a (click)="backToIndexPage()" class="back-to-index">
                  Back to Index
                </a>
              </label>
            </div>
          </div>

          <!-- BODY -->
          <div class="portlet-body">

            <form
              #taskCategoryForm="ngForm"
              (ngSubmit)="onSubmit(taskCategoryForm)"
              novalidate
            >

              <div class="form-body">

                <!-- Mandatory message -->
                <div class="row">
                  <div class="col-md-12 mandatory_div mb_20">
                    <span>
                      Fields with <span class="required">*</span> mark are
                      mandatory
                    </span>
                  </div>
                </div>

                <div class="row">

                  <!-- Department -->
                  <div class="col-md-3">
                    <div class="form-group">

                      <label class="sbold">
                        Department
                        <span class="required">*</span>
                      </label>

                      <select
                        class="form-control"
                        [(ngModel)]="taskCategory.departmentId"
                        name="departmentId"
                        required
                        #departmentCtrl="ngModel"
                      >

                        <!-- IMPORTANT: default option -->
                        <option [ngValue]="null">
                          -- Select Department --
                        </option>

                        <option
                          *ngFor="let department of departments"
                          [ngValue]="department.departmentId"
                        >
                          {{ department.name }}
                        </option>

                      </select>

                      <div
                        class="text-danger"
                        *ngIf="
                          departmentCtrl.errors?.['required'] &&
                          departmentCtrl.touched
                        "
                      >
                        Department is required
                      </div>

                    </div>
                  </div>

                  <!-- Task Category Name -->
                  <div class="col-md-3">
                    <div class="form-group">

                      <label class="sbold">
                        Task Category
                        <span class="required">*</span>
                      </label>

                      <input
                        class="form-control"
                        type="text"
                        placeholder="Enter Task Category Name"
                        [(ngModel)]="taskCategory.name"
                        name="name"
                        required
                        minlength="2"
                        maxlength="100"
                        (input)="
                          taskCategory.name =
                            capitalizeFirstCharOnly(taskCategory.name)
                        "
                        #nameCtrl="ngModel"
                        pattern="^[a-zA-Z0-9\s\.,;:=$\-_\+'&quot;/\\!@`#%&*()?]+$"
                      />

                      <div
                        class="text-danger"
                        *ngIf="
                          nameCtrl.errors?.['required'] &&
                          nameCtrl.touched
                        "
                      >
                        Task Category Name is required
                      </div>

                      <div
                        class="text-danger"
                        *ngIf="
                          nameCtrl.errors?.['minlength'] &&
                          nameCtrl.touched
                        "
                      >
                        Minimum 2 characters required
                      </div>

                      <div
                        class="text-danger"
                        *ngIf="
                          nameCtrl.errors?.['maxlength'] &&
                          nameCtrl.touched
                        "
                      >
                        Maximum 100 characters allowed
                      </div>

                      <div
                        class="text-danger"
                        *ngIf="
                          nameCtrl.errors?.['pattern'] &&
                          nameCtrl.touched
                        "
                      >
                        Only a-z, 0-9, . , ; : = $ - _ + ' " / \ ! &#64; ` #
                        % & * ( ) ? are allowed
                      </div>

                    </div>
                  </div>

                  <!-- Status - Edit only -->
                  <div class="col-md-3" *ngIf="isEditMode">
                    <div class="form-group">

                      <label class="sbold">
                        Status
                        <span class="required">*</span>
                      </label>

                      <select
                        class="form-control"
                        [(ngModel)]="taskCategory.status"
                        name="status"
                        required
                        #statusCtrl="ngModel"
                      >

                        <option [ngValue]="null">
                          -- Select Status --
                        </option>

                        <option [ngValue]="1">
                          Active
                        </option>

                        <option [ngValue]="2">
                          Inactive
                        </option>

                      </select>

                      <div
                        class="text-danger"
                        *ngIf="
                          statusCtrl.errors?.['required'] &&
                          statusCtrl.touched
                        "
                      >
                        Status is required
                      </div>

                    </div>
                  </div>

                  <!-- Buttons -->
                  <div class="col-md-12 text-center">

                    <button
                      type="button"
                      (click)="onReset()"
                      class="btn default"
                    >
                      Reset
                    </button>

                    &nbsp;

                    <button
                      type="submit"
                      class="btn green"
                    >
                      Submit
                    </button>

                  </div>

                </div>
              </div>

            </form>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>
