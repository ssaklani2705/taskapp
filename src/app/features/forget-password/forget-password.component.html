<div class="forget-password-container">
  <div class="form-box">
    <div class="logo ">
      <img [src]="imgUrl + 'assets/logo/logo.png'" alt="hdapp Logo" />
    </div>

    <!-- <h3>Forgot Password</h3> -->
    <p class="mandatory">Fields marked with * are mandatory.</p>

    <!-- <form [formGroup]="forgetPasswordForm" (ngSubmit)="onSubmit()"> -->
<form [formGroup]="forgetPasswordForm" >
      <!-- Password Field -->
      <div class="form-group">
        <label>Password<span class="required">*</span> :</label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter Password"
        />
        <div *ngIf="submitted && f['password']?.errors" class="error">
          <span style="text-align: left;" *ngIf="f['password']?.errors?.['required']">
            Password is required.
          </span>
          <span style="text-align: left;" *ngIf="f['password']?.errors?.['minlength']">
            Minimum 6 characters required.
          </span>
        </div>
      </div>

      <!-- Confirm Password Field -->
      <div class="form-group">
        <label>Confirm Password<span class="required">*</span> :</label>
        <input
          type="password"
          formControlName="confirmPassword"
          placeholder="Enter Confirm Password"
        />
        <div *ngIf="submitted && f['confirmPassword']?.errors" class="error">
          <span *ngIf="f['confirmPassword']?.errors?.['required']">
            Confirm Password is required.
          </span>
        </div>
        <div
          *ngIf="submitted && forgetPasswordForm.errors?.['mismatch']"
          class="error"
        >
          Passwords do not match.
        </div>
      </div>

      <!-- Buttons -->
      <div class="buttons">
        <button type="submit" class="submit-btn" (click)="onSubmit()" >SUBMIT</button>
        <button type="button" (click)="onReset()" class="reset-btn">RESET</button>
      </div>
    </form>

    <!-- Login Link -->
     <br>
    <a routerLink="/login" class="login-link">Click here to Login</a>
  </div>
</div>
